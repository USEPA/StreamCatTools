# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

name: test-coverage

permissions: 
  contents: write
  checks: write
  pull-requests: write

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Force CRAN for pak/renv resolution to avoid RSPM snapshot mismatch
      RENV_CONFIG_REPOS_OVERRIDE: https://cran.rstudio.com

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          # disable public RSPM to avoid using RSPM snapshots during CI
          use-public-rspm: false

      - name: Install system dependencies
        # xml2, curl, openssl and many packages need system headers to build from source
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libssl-dev libcurl4-openssl-dev

      - name: Ensure pak is installed and current
        # Install/upgrade pak from CRAN to ensure exported API is available
        run: |
          Rscript -e 'if (!requireNamespace("pak", quietly = TRUE)) install.packages("pak", repos = "https://cran.rstudio.com")'
          Rscript -e 'message("pak version: ", as.character(packageVersion("pak"))); message("pak exports:"); print(head(getNamespaceExports("pak"), 200))'

      - name: Debug pak resolution (safe checks)
        # Do not call non-exported pak internals like pak::resolve; instead use exported APIs and print diagnostics
        run: |
          Rscript -e '
            if (!requireNamespace("pak", quietly = TRUE)) {
              install.packages("pak", repos = "https://cran.rstudio.com")
            }
            message("pak version: ", as.character(packageVersion("pak")))
            message("sessionInfo:")
            print(sessionInfo())
            message("Trying a safe pak operation (pkg_install with upgrade=FALSE)...")
            tryCatch({
              # Use exported pak API to verify installer works. Use upgrade=FALSE to avoid changing runner state excessively.
              pak::pkg_install(c("covr", "xml2"), upgrade = FALSE, ask = FALSE)
              message("pak::pkg_install completed (or packages were already installed).")
            }, error = function(e) {
              message("pak::pkg_install failed: ", conditionMessage(e))
              stop(e)
            })
          '

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
          cache-version: 3  # Bump cache-version to avoid reusing an older pak installation

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
          if-no-files-found: ignore  # Suppress warnings if no files are found

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./cobertura.xml

      - name: Comment coverage
        uses: 5monkeys/cobertura-action@master
        with:
          report_name: coverage-report
          path: ./cobertura.xml
          minimum_coverage: 10
          show_missing: true
          link_missing_lines: true